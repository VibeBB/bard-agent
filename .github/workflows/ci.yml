name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      # Only pull_request events diff BASE_SHA..HEAD_SHA; push/dispatch/call
      # events short-circuit to code=true below and never need the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        # sdk-check installs openhands-sdk/tools so
        # tests/test_plugin_assets.py::test_sdk_plugin_load exercises the
        # real plugin load instead of skipping on importorskip.
        run: uv sync --locked --group sdk-check
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Check shared hooks
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Verify docs
        run: uv run python scripts/verify_docs.py

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/bard-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/bard-tools.Dockerfile .

  independent-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Pull pinned bard-tools image
        run: |
          ref=$(python3 -c \
            "import json; d = json.load(open('plugins/bard/skills/bard-render/tools-image.json', encoding='utf-8')); print(d['image'] + '@' + d['digest'])")
          docker pull "$ref"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: independent-check
      - name: Sync dependencies
        run: uv sync --locked
      - name: abcm2ps tests (inside pinned image)
        env:
          BARD_REQUIRE_DOCKER: "1"
        run: uv run pytest -q -k abcm2ps -p no:cacheprovider -rs
      - name: Render sample scores
        run: |
          for lang in en ja; do
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --proposal "tests/fixtures/valid_${lang}.json" \
              --out-dir "out/ci/${lang}"
            uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py \
              --abc "out/ci/${lang}/song.abc" --out-dir "out/ci/${lang}" --json
          done
      - name: Render shipped examples
        run: |
          for lang in en ja; do
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --proposal "plugins/bard/skills/bard-render/examples/minimal.${lang}.json" \
              --out-dir "$(mktemp -d)/${lang}"
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --check \
              --proposal "plugins/bard/skills/bard-render/examples/minimal.${lang}.json" \
              --out-dir /tmp/unused
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-samples
          path: out/ci
          retention-days: 14

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
