name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      code: ${{ steps.scope.outputs.code }}
      pinscript: ${{ steps.scope.outputs.pinscript }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      # Only pull_request events diff BASE_SHA..HEAD_SHA; push/dispatch/call
      # events short-circuit to code=true below and never need the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          pinscript=false
          if grep -qE '^(scripts/publish_image_pin_pr\.sh|tests/test_publish_image_pin_pr\.py|\.github/workflows/publish-bard-images\.yml)$' "$RUNNER_TEMP/changed-files"; then
            pinscript=true
          fi
          echo "pinscript=$pinscript" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        # sdk-check installs openhands-sdk/tools so
        # tests/test_plugin_assets.py::test_sdk_plugin_load exercises the
        # real plugin load instead of skipping on importorskip.
        run: uv sync --locked --group sdk-check
      # The check legs are independent `uv run` invocations once the venv
      # exists: run them as background steps so they overlap, and join them
      # at the end. They keep top-level `id:`s (not a `parallel:` group) so
      # the outcome references stay visible to actionlint's expression
      # checker.
      - name: Ruff
        id: ruff
        background: true
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        id: pyright
        background: true
        run: uv run pyright
      - name: Check shared hooks
        id: check-shared-hooks
        background: true
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        background: true
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        id: pytest
        background: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Verify docs
        id: verify-docs
        background: true
        run: uv run python scripts/verify_docs.py
      - name: Wait for check legs
        wait-all:

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: verify (3.15)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: true
        with:
          python-version: "3.15"
          cache-suffix: verify-3.15
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: true
        # sdk-check installs openhands-sdk/tools so
        # tests/test_plugin_assets.py::test_sdk_plugin_load exercises the
        # real plugin load instead of skipping on importorskip.
        run: uv sync --locked --group sdk-check
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        id: pyright
        continue-on-error: true
        run: uv run pyright
      - name: Check shared hooks
        id: check-shared-hooks
        continue-on-error: true
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        continue-on-error: true
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Verify docs
        id: verify-docs
        continue-on-error: true
        run: uv run python scripts/verify_docs.py
      - name: Report 3.15 canary outcome
        if: always() && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure' || steps.check-shared-hooks.outcome == 'failure' || steps.check-shared-workflows.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.verify-docs.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/bard-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/bard-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  # prodeng-style guard: the pin-PR script drives branch protection and
  # auto-merge during real publishes, so its stub tests run on PRs that
  # touch the script, its tests, or the publishing workflow.
  pin-script-guard:
    needs: changes
    if: needs.changes.outputs.pinscript == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: pin-script-guard
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run pin-PR script tests
        run: uv run pytest tests/test_publish_image_pin_pr.py -q

  independent-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Gate the render on cryptographic verification of the lock's
      # provenance attestation: a bad attestation blocks the pin PR
      # instead of being discovered on main later.
      BARD_VERIFY_ATTESTATION: require
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The pinned-image pull only needs the checked-out lock file: run it
      # as a background step so it overlaps setup-uv and the venv sync, and
      # join it before the first step that runs the image.
      - name: Pull pinned bard-tools image
        id: pull-image
        background: true
        run: |
          ref=$(python3 -c \
            "import json; d = json.load(open('plugins/bard/skills/bard-render/tools-image.json', encoding='utf-8')); print(d['image'] + '@' + d['digest'])")
          docker pull "$ref"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: independent-check
      - name: Sync dependencies
        run: uv sync --locked
      - name: Wait for pinned image pull
        wait: pull-image
      - name: Verify pin attestation and prewarm image
        run: |
          set -euo pipefail
          # --prewarm verifies the lock's provenance attestation even when
          # the image is already local; retry once for attestation-API
          # flakes before failing the pin gate.
          for attempt in 1 2; do
            uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py --prewarm && break
            echo "::warning::attestation prewarm failed (attempt $attempt)"
            sleep 30
          done
      # The abcm2ps check and the two render checks are independent and
      # write disjoint output paths (out/ci/* vs fresh mktemp dirs), so
      # they run as a parallel group; the implicit wait still lands all of
      # them before the artifact upload below.
      - parallel:
          - name: abcm2ps tests (inside pinned image)
            env:
              BARD_REQUIRE_DOCKER: "1"
            run: uv run pytest -q -k abcm2ps -p no:cacheprovider -rs
          - name: Render sample scores
            run: |
              for lang in en ja; do
                uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
                  --proposal "tests/fixtures/valid_${lang}.json" \
                  --out-dir "out/ci/${lang}"
                uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py \
                  --abc "out/ci/${lang}/song.abc" --out-dir "out/ci/${lang}" --json
                uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py \
                  --svg "out/ci/${lang}/song.contour.svg" --out-dir "out/ci/${lang}" --json
              done
              mkdir -p out/ci/cues
              uv run python plugins/bard/skills/bard-render/scripts/render_cues.py \
                --cues "plugins/bard/skills/bard-render/examples/smart-kettle.cues.json" \
                --out-dir out/ci/cues
              uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py \
                --svg "out/ci/cues/cues.timeline.svg" --out-dir out/ci/cues --json
          - name: Render shipped examples
            run: |
              for lang in en ja; do
                uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
                  --proposal "plugins/bard/skills/bard-render/examples/minimal.${lang}.json" \
                  --out-dir "$(mktemp -d)/${lang}"
                uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
                  --check \
                  --proposal "plugins/bard/skills/bard-render/examples/minimal.${lang}.json" \
                  --out-dir /tmp/unused
              done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-samples
          path: out/ci
          retention-days: 14

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
