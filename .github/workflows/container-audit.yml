name: Container hardening audit

on:
  schedule:
    - cron: "42 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned image from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scan to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned image
        run: |
          set -euo pipefail
          # Same structural validation as locked-image-check.yml: a malformed
          # lock fails here instead of pulling an unexpected reference.
          ref=$(python3 - <<'PY'
          import json, re
          entry = json.load(open("plugins/bard/skills/bard-render/tools-image.json", encoding="utf-8"))
          if entry.get("image") != "ghcr.io/vibebb/bard-tools":
              raise SystemExit("tools-image.json has an unexpected image")
          digest = entry.get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("tools-image.json digest must be a sha256 digest")
          tag = entry.get("tag")
          if not isinstance(tag, str) or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None:
              raise SystemExit("tools-image.json tag must be a 40-character tools tag")
          print(entry["image"] + "@" + digest)
          PY
          )
          echo "PINNED_IMAGE=$ref" >> "$GITHUB_ENV"
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker pull "$ref"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      # The scan legs below each run trivy with a private TRIVY_CACHE_DIR
      # seeded from the weekly-cached copy: concurrent trivy processes in
      # one cache dir race on db/metadata.json and corrupt it. The weekly
      # key lets the run reuse a ~120 MB DB instead of re-downloading it
      # every Monday.
      - id: trivy-db-week
        run: echo "key=trivy-db-$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-db-week.outputs.key }}
      - name: Warm the Trivy DB before the parallel scans
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        # Populate the shared cache dir serially so the scan legs below
        # only ever read the DB (concurrent DB downloads in one cache dir
        # are not safe).
        run: |
          trivy image --download-db-only
          # The java-db mirror blob is ~934 MB; if the image ships jars,
          # every leg would otherwise fetch it into its private cache dir at
          # once (the disk-quota kill on the dashboard audit). Warm it once
          # into the shared seed so the per-leg copies carry it.
          trivy image --download-java-db-only
          # Give every leg a private copy of the warm seed; the legs only
          # ever write to their own dir.
          for leg in sarif json cis; do
            mkdir -p "$RUNNER_TEMP/trivy-cache-$leg"
            cp -a "$TRIVY_CACHE_DIR/." "$RUNNER_TEMP/trivy-cache-$leg/"
          done
      # The four scans read the same pinned image and the now-warm
      # vulnerability DB, and each writes a disjoint report path, so they
      # run as one parallel group (implicit wait at the end).
      - parallel:
          - name: Scan pinned image (Trivy SARIF)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            env:
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-sarif
            with:
              scan-type: image
              # The digest is frozen; the vulnerability DB is not — this scan
              # surfaces newly disclosed CVEs against the shipped tools image.
              scan-ref: ${{ env.PINNED_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig
              severity: CRITICAL,HIGH
              ignore-unfixed: true
              exit-code: '0'
              format: sarif
              output: trivy-image.sarif
              limit-severities-for-sarif: true
              skip-setup-trivy: true
          - name: Scan pinned image (Trivy JSON, full)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            env:
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-json
            with:
              scan-type: image
              scan-ref: ${{ env.PINNED_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              exit-code: '0'
              format: json
              output: trivy-image.json
              skip-setup-trivy: true
          - name: Run Docker CIS compliance report
            env:
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-cis
            run: |
              set -euo pipefail
              # Returns 0 when the report carries at least one CIS check result
              # (a silently-empty report is a scanner anomaly, not coverage).
              cis_nonempty() {
                python3 - "$1" <<'PY'
              import json, sys
              def _summaries(node):
                  yield node
                  for child in node.get("Results") or []:
                      yield from _summaries(child)
              try:
                  data = json.load(open(sys.argv[1], encoding="utf-8"))
              except (OSError, ValueError):
                  data = {}
              total = 0
              for node in _summaries(data):
                  summary = node.get("MisconfSummary") or {}
                  total += int(summary.get("Successes", 0)) + int(summary.get("Failures", 0))
              sys.exit(0 if total else 1)
              PY
              }
              for attempt in 1 2 3; do
                trivy image --compliance docker-cis-1.6.0 --include-non-failures --report all \
                  --ignorefile /dev/null --format json \
                  --output "$RUNNER_TEMP/trivy-cis.json" "${PINNED_IMAGE}"
                cis_nonempty "$RUNNER_TEMP/trivy-cis.json" && break
                # Retry once on an empty result set before letting the
                # aggregation guard below fail the job — the 2026-10-03 audit
                # observed a transient zero-result scan on a healthy digest.
                echo "::warning::Docker CIS scan produced no results (attempt $attempt)"
                sleep 30
              done
          - name: Run informational Lynis audit inside the image
            id: lynis
            continue-on-error: true
            env:
              LYNIS_OUT: ${{ runner.temp }}/lynis-out
            run: |
              set -uo pipefail
              git clone --depth 1 --branch 3.1.7 \
                https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
              # 3.1.7 is a mutable tag; detach onto its reviewed commit so a
              # moved tag fails loudly instead of running different code.
              git -C "$RUNNER_TEMP/lynis" checkout --detach \
                2e99f92265760b73fd6b139868eb8d4116624030 || exit 1
              # Lynis requires its tree to be owned by the auditing user (root
              # inside the container); the clone lands as the runner uid, so
              # re-own it to silence the ownership warnings.
              sudo -n chown -R 0:0 "$RUNNER_TEMP/lynis" || true
              mkdir -p "$LYNIS_OUT"
              docker run --rm --user 0 \
                -v "$RUNNER_TEMP/lynis:/lynis:ro" \
                -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
                -v "$LYNIS_OUT:/out" \
                --entrypoint /bin/sh "$PINNED_IMAGE" \
                -c '# The minimal image lacks procps/iproute2; without them the
                    process and network tests resolve to not-found, which silently
                    blinds the audit. An install failure still lets lynis run.
                    apt-get update -qq \
                    && apt-get install -y -qq --no-install-recommends \
                       procps iproute2 >/dev/null 2>&1 \
                    || echo "::warning::audit-image package install failed; partial lynis coverage"; \
                    cd /lynis && ./lynis audit system --quick --no-colors \
                    --profile /container.prf \
                    --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                    --auditor github-actions; \
                    chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
              index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
                | head -1 | cut -d= -f2 || true)
              warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
              printf 'hardening_index=%s\nwarnings=%s\n' \
                "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-bard-tools-audit
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON: trivy-image.json
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from collections import Counter
          trivy = json.load(open(os.environ["TRIVY_JSON"], encoding="utf-8"))
          vulns, secrets, licenses = Counter(), Counter(), 0
          mis_pass = mis_total = 0
          fixable_high = 0
          top_fixable = []
          for result in trivy.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  sev = v.get("Severity", "UNKNOWN").lower()
                  fixed = bool(v.get("FixedVersion"))
                  vulns[sev] += 1
                  if fixed:
                      vulns[f"{sev}_fixed"] += 1
                      if sev in ("critical", "high"):
                          fixable_high += 1
                          top_fixable.append({
                              "id": v.get("VulnerabilityID", "?"),
                              "pkg": v.get("PkgName", "?"),
                              "severity": v.get("Severity", "UNKNOWN"),
                              "fixed": v.get("FixedVersion", ""),
                          })
              mis = result.get("Misconfigurations") or []
              for m in mis:
                  mis_total += 1
                  if m.get("Status") == "PASS":
                      mis_pass += 1
              for s in result.get("Secrets") or []:
                  secrets[s.get("Severity", "UNKNOWN").lower()] += 1
              for lic in result.get("Licenses") or []:
                  licenses += 1
          cis = {"passed": 0, "failed": 0, "failures": []}
          try:
              cis_data = json.load(open(os.environ["TRIVY_CIS"], encoding="utf-8"))
          except (OSError, ValueError):
              cis_data = {}
          # trivy --compliance nests check summaries deeper than top-level
          # Results; walk the tree so the CIS leg cannot silently no-op.
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          for result in _summaries(cis_data):
              summary = result.get("MisconfSummary") or {}
              cis["passed"] += int(summary.get("Successes", 0))
              cis["failed"] += int(summary.get("Failures", 0))
          if cis["passed"] + cis["failed"] == 0:
              # dead telemetry must fail, not masquerade as coverage
              sys.exit("Docker CIS scan produced no results")
          for result in _summaries(cis_data):
              for m in result.get("Misconfigurations") or []:
                  if m.get("Status") == "FAIL":
                      cis["failures"].append({
                          "id": m.get("ID") or m.get("AVDID") or "?",
                          "severity": m.get("Severity", "UNKNOWN"),
                          "title": m.get("Title", ""),
                      })
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          image, _, digest = os.environ["PINNED_IMAGE"].partition("@")
          top_fixable.sort(key=lambda v: (v["severity"] != "CRITICAL", v["id"]))
          report = {
              "image": image,
              "digest": digest,
              "trivy": {
                  "critical": vulns["critical"],
                  "high": vulns["high"],
                  "medium": vulns["medium"],
                  "low": vulns["low"],
                  "fixable_high_or_critical": fixable_high,
                  "misconfig_pass": mis_pass,
                  "misconfig_total": mis_total,
                  "secrets": sum(secrets.values()),
                  "license_findings": licenses,
                  "top_fixable": top_fixable[:15],
              },
              "cis_docker": cis,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_high},
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload hardening report
        if: always() && hashFiles('container-hardening.json', 'trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-tools-hardening-audit
          path: |
            container-hardening.json
            trivy-image.json
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
          PREV_MD: ${{ runner.temp }}/hardening-prev.md
        run: |
          set -euo pipefail
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          numbers=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[].number')
          number=$(head -n1 <<< "$numbers")
          # A second open report issue would silently fork the report
          # stream; close extras so the canonical one keeps updating.
          for extra in $(tail -n +2 <<< "$numbers"); do
            gh issue close "$extra" --repo "$GITHUB_REPOSITORY" \
              --comment "Duplicate of the canonical report issue #${number}." || true
          done
          # Trend line: diff against the most recent report issue (open or
          # closed) so week-over-week drift survives issue turnover.
          : > "$PREV_MD"
          prev=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$prev" ]; then
            gh issue view "$prev" --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > "$PREV_MD" || : > "$PREV_MD"
          fi
          python3 - <<'PY' > "$REPORT_MD"
          import json, os, re
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          t = r["trivy"]
          prev = ""
          try:
              prev = open(os.environ["PREV_MD"], encoding="utf-8").read()
          except OSError:
              pass
          m = re.search(r"Trivy vulns C/H/M/L \| (\d+)/(\d+)/(\d+)/(\d+)", prev)
          delta = "n/a (first report)"
          if m:
              pc, ph, pm, pl = (int(g) for g in m.groups())
              d = (
                  t["critical"] - pc,
                  t["high"] - ph,
                  t["medium"] - pm,
                  t["low"] - pl,
              )
              delta = f"{d[0]:+d}/{d[1]:+d}/{d[2]:+d}/{d[3]:+d} (was {pc}/{ph}/{pm}/{pl})"
          print(f"# Container hardening report\n")
          print(f"Image: `{r['image']}`\nDigest: `{r['digest']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
          print(f"| Delta since last report C/H/M/L | {delta} |")
          print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
          print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
          print(f"| Secrets found | {t['secrets']} |")
          print(f"| CIS Docker pass/fail | {r['cis_docker']['passed']}/{r['cis_docker']['failed']} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          failures = r["cis_docker"].get("failures") or []
          if failures:
              print("\n### Failed CIS Docker checks\n")
              print("| Check | Severity | Title |")
              print("|---|---|---|")
              for f in failures:
                  print(f"| {f['id']} | {f['severity']} | {f['title']} |")
          fixable = t.get("top_fixable") or []
          if fixable:
              print("\n### Top fixable vulnerabilities\n")
              print("| CVE | Package | Severity | Fixed in |")
              print("|---|---|---|---|")
              for v in fixable:
                  print(f"| {v['id']} | {v['pkg']} | {v['severity']} | {v['fixed']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
