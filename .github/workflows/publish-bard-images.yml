name: Publish bard images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-bard-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "scripts/measure_image_tools.py"
      - "scripts/update_tools_image_lock.py"
      - "!docker/README.md"
      # The lock file is written by this workflow itself; exclude it so a
      # merged lock PR does not trigger another publish.
      - "!plugins/bard/skills/bard-render/tools-image.json"

# Elevated scopes live on the job; the workflow default stays empty.
permissions: {}

# Publishes are serialized: concurrent runs race on the `latest` alias and on
# the lock update branch, so a queued run must wait for the previous one.
concurrency:
  group: publish-bard-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write # dispatches ci/workflow-lint and approves action_required runs on the pin branch
      contents: write # pushes the bot lock branch
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      packages: write # pushes the ghcr.io bard-tools image
      pull-requests: write # opens, auto-merges, and cleans up the lock PR
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # GHCR namespaces must be lowercase; repository_owner may contain capitals.
          printf 'OWNER_LC=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # The immutable `<sha>-tools` tag is what the lock records; `latest` is
      # only a convenience alias and is never a lock verification target.
      - name: Build and publish tools image
        id: tools_publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/bard-tools.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest tools image provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/bard-tools
          subject-digest: ${{ steps.tools_publish.outputs.digest }}
          push-to-registry: true
      - name: Resolve published digest
        env:
          BUILT_DIGEST: ${{ steps.tools_publish.outputs.digest }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in
            sha256:*) ;;
            *)
              echo "unresolved bard-tools digest: $BUILT_DIGEST" >&2
              exit 1
              ;;
          esac
          {
            printf 'TOOLS_REF=ghcr.io/%s/bard-tools@%s\n' "$OWNER_LC" "$BUILT_DIGEST"
            printf 'TOOLS_DIGEST=%s\n' "$BUILT_DIGEST"
            printf 'TOOLS_TAG=%s-tools\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: registry
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/bard-tools.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package tools SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/bard-tools.full.spdx.json" \
            "$RUNNER_TEMP/bard-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/bard-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/bard-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        id: attest_sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/vibebb/bard-tools
          subject-digest: ${{ steps.tools_publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/bard-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-tools-spdx-sbom
          path: ${{ runner.temp }}/bard-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published tools image
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          python3 scripts/measure_image_tools.py \
            --image-ref "$TOOLS_REF" \
            --out "$RUNNER_TEMP/bard-tools-tools.json"
      # The render toolchain smoke mirrors the Dockerfile build-time check:
      # run the published image so a push that produced a broken artifact
      # fails here instead of surfacing at render time.
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          docker pull "$TOOLS_REF"
          docker run --rm "$TOOLS_REF" sh -c \
            "printf 'X:1\nT:smoke\nM:4/4\nL:1/8\nK:C\nC D E F |]\n' > /tmp/smoke.abc \
            && abcm2ps -g /tmp/smoke.abc -O /tmp/smoke.svg \
            && rsvg-convert /tmp/smoke001.svg -o /tmp/smoke.png \
            && test -s /tmp/smoke.png"
      - name: Record published image summary
        run: |
          {
            echo "## bard-tools image"
            echo
            echo "- **image**: \`$TOOLS_REF\`"
            echo "- **tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update image pin and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_REF: ${{ env.TOOLS_REF }}
          TOOLS_DIGEST: ${{ env.TOOLS_DIGEST }}
          TOOLS_TAG: ${{ env.TOOLS_TAG }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the
          # published source commit, so the PR stays mergeable when main moved
          # during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          python3 scripts/update_tools_image_lock.py \
            --pin plugins/bard/skills/bard-render/tools-image.json \
            --image "ghcr.io/${OWNER_LC}/bard-tools" \
            --tag "$TOOLS_TAG" \
            --digest "$TOOLS_DIGEST" \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/bard-tools-tools.json"
          # status --porcelain (not diff --quiet) also catches an untracked
          # pin file, matching the other agent publish workflows.
          if [ -z "$(git status --porcelain -- plugins/bard/skills/bard-render/tools-image.json)" ]; then
            echo "Tools image pin is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bard/skills/bard-render/tools-image.json
          git commit -m "Update bard-tools image pin"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the bard-tools image pin." \
            "" \
            "image: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review (observed: #25 and #31 stayed open).
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${workflow_run}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update bard-tools image pin" \
            --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml workflow-lint.yml"
