name: Publish bard images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the publish: build and scan the image locally, but skip the registry push, :latest promotion, attestations, the digest-lock PR, and post-merge dispatches"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-bard-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "scripts/measure_image_tools.py"
      - "scripts/update_tools_image_lock.py"
      - "!docker/README.md"
      # The lock file is written by this workflow itself; exclude it so a
      # merged lock PR does not trigger another publish.
      - "!plugins/bard/skills/bard-render/tools-image.json"

# Elevated scopes live on the job; the workflow default stays empty.
permissions: {}

# Publishes are serialized: concurrent runs race on the `latest` alias and on
# the lock update branch, so a queued run must wait for the previous one.
concurrency:
  group: publish-bard-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write # dispatches ci/workflow-lint and approves action_required runs on the pin branch
      contents: write # pushes the bot lock branch
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      security-events: write # uploads the Trivy SARIF scan to code scanning
      packages: write # pushes the ghcr.io bard-tools image
      pull-requests: write # opens, auto-merges, and cleans up the lock PR
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # GHCR namespaces must be lowercase; repository_owner may contain capitals.
          printf 'OWNER_LC=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # The immutable `<sha>-tools` tag is what the lock records; `latest` is
      # only a convenience alias and is never a lock verification target.
      - name: Build and publish tools image
        id: tools_publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/bard-tools.Dockerfile
          # dry_run keeps the image in the local daemon for the gates
          # below; nothing reaches the registry.
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run == true }}
          # Immutable tag only: a failing image must never serve :latest;
          # the tag is promoted after every gate passes.
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan tools image (Trivy SARIF)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the immutable sha tag — the same manifest the pushed
          # digest addresses on a real run, and the local image under
          # dry_run.
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Scan tools image (Trivy JSON)
        # Runs even when the SARIF gate above found fixable CVEs, so the
        # full report is still emitted on a gate failure.
        if: always() && steps.tools_publish.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-image.json
          skip-setup-trivy: true
      - name: Upload Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: always() && inputs.dry_run != true && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-bard-tools
      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-tools-trivy
          path: trivy-image.json
          retention-days: 90
      - name: Summarize Trivy gate failure
        # When the SARIF gate found fixable CRITICAL/HIGH findings, list
        # the offending rules in the step summary so the publish failure
        # is reviewable without downloading artifacts.
        if: always() && steps.trivy-scan.outcome == 'failure' && hashFiles('trivy-image.sarif') != ''
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("trivy-image.sarif", encoding="utf-8"))
          rules = {}
          for run in data.get("runs") or []:
              driver = run.get("tool", {}).get("driver", {}) or {}
              for rule in driver.get("rules") or []:
                  rules[rule.get("id", "")] = rule
          rows = []
          for run in data.get("runs") or []:
              for result in run.get("results") or []:
                  rid = result.get("ruleId", "?")
                  rule = rules.get(rid) or {}
                  cvss = (rule.get("properties") or {}).get("security-severity", "")
                  level = result.get("level", "")
                  message = (result.get("message") or {}).get("text") or ""
                  message = " ".join(message.split()).replace("|", "\\|")[:160]
                  rows.append((rid, cvss, level, message))
          if rows:
              print("### Trivy gate: fixable CRITICAL/HIGH findings\n")
              print("| rule | severity (CVSS) | level | detail |")
              print("|---|---|---|---|")
              for rid, cvss, level, message in rows:
                  print(f"| {rid} | {cvss} | {level} | {message} |")
          PY
      - name: Attest tools image provenance
        if: inputs.dry_run != true
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/bard-tools
          subject-digest: ${{ steps.tools_publish.outputs.digest }}
          push-to-registry: true
      - name: Resolve published digest
        env:
          BUILT_DIGEST: ${{ steps.tools_publish.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # Nothing was pushed: reference the image by its local tag.
            {
              printf 'TOOLS_REF=ghcr.io/%s/bard-tools:%s-tools\n' "$OWNER_LC" "$SOURCE_SHA"
              printf 'TOOLS_TAG=%s-tools\n' "$SOURCE_SHA"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          case "$BUILT_DIGEST" in
            sha256:*) ;;
            *)
              echo "unresolved bard-tools digest: $BUILT_DIGEST" >&2
              exit 1
              ;;
          esac
          {
            printf 'TOOLS_REF=ghcr.io/%s/bard-tools@%s\n' "$OWNER_LC" "$BUILT_DIGEST"
            printf 'TOOLS_DIGEST=%s\n' "$BUILT_DIGEST"
            printf 'TOOLS_TAG=%s-tools\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # dry_run pulls the just-built image from the local daemon.
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/bard-tools.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package tools SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/bard-tools.full.spdx.json" \
            "$RUNNER_TEMP/bard-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/bard-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/bard-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        if: inputs.dry_run != true
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/bard-tools
          subject-digest: ${{ steps.tools_publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/bard-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bard-tools-spdx-sbom
          path: ${{ runner.temp }}/bard-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published tools image
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          python3 scripts/measure_image_tools.py \
            --image-ref "$TOOLS_REF" \
            --out "$RUNNER_TEMP/bard-tools-tools.json"
      # The render toolchain smoke mirrors the Dockerfile build-time check:
      # run the published image so a push that produced a broken artifact
      # fails here instead of surfacing at render time.
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # dry_run already holds the image in the local daemon.
          if [ "$DRY_RUN" != "true" ]; then
            docker pull "$TOOLS_REF"
          fi
          docker run --rm "$TOOLS_REF" sh -c \
            "printf 'X:1\nT:smoke\nM:4/4\nL:1/8\nK:C\nC D E F |]\n' > /tmp/smoke.abc \
            && abcm2ps -g /tmp/smoke.abc -O /tmp/smoke.svg \
            && rsvg-convert /tmp/smoke001.svg -o /tmp/smoke.png \
            && test -s /tmp/smoke.png"
      - name: Promote :latest
        # Every gate above passed: copy the verified manifest to :latest
        # server-side (attestations and the SBOM keep binding the digest).
        # A gate failure leaves the previous good :latest untouched.
        if: inputs.dry_run != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER_LC}/bard-tools:latest" \
            "$TOOLS_REF"
      - name: Record published image summary
        run: |
          {
            echo "## bard-tools image"
            echo
            echo "- **image**: \`$TOOLS_REF\`"
            echo "- **tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update image pin and merge PR
        # dry_run stops at the summary: no lock PR, no post-merge dispatches.
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_REF: ${{ env.TOOLS_REF }}
          TOOLS_DIGEST: ${{ env.TOOLS_DIGEST }}
          TOOLS_TAG: ${{ env.TOOLS_TAG }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the
          # published source commit, so the PR stays mergeable when main moved
          # during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          python3 scripts/update_tools_image_lock.py \
            --pin plugins/bard/skills/bard-render/tools-image.json \
            --image "ghcr.io/${OWNER_LC}/bard-tools" \
            --tag "$TOOLS_TAG" \
            --digest "$TOOLS_DIGEST" \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/bard-tools-tools.json"
          # status --porcelain (not diff --quiet) also catches an untracked
          # pin file, matching the other agent publish workflows.
          if [ -z "$(git status --porcelain -- plugins/bard/skills/bard-render/tools-image.json)" ]; then
            echo "Tools image pin is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bard/skills/bard-render/tools-image.json
          git commit -m "Update bard-tools image pin"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the bard-tools image pin." \
            "" \
            "image: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review (observed: #25 and #31 stayed open).
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${workflow_run}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update bard-tools image pin" \
            --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml workflow-lint.yml"
      - name: Note dry-run skips
        if: inputs.dry_run
        run: |
          {
            echo "### dry-run rehearsal"
            echo
            echo "Built and scanned \`$TOOLS_REF\` without publishing. Skipped:"
            echo "- registry push of the image tag"
            echo "- SARIF upload to code scanning"
            echo "- provenance and SBOM attestations"
            echo "- :latest promotion"
            echo "- digest-lock pull request and post-merge dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
