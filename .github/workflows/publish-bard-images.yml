name: Publish bard images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-bard-images.yml"
      - "scripts/measure_image_tools.py"
      - "scripts/update_tools_image_lock.py"
      - "!docker/README.md"
      # The lock file is written by this workflow itself; exclude it so a
      # merged lock PR does not trigger another publish.
      - "!plugins/bard/skills/bard-render/tools-image.json"

# Publishes are serialized: concurrent runs race on the `latest` alias and on
# the lock update branch, so a queued run must wait for the previous one.
concurrency:
  group: publish-bard-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # GHCR namespaces must be lowercase; repository_owner may contain capitals.
          printf 'OWNER_LC=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # The immutable `<sha>-tools` tag is what the lock records; `latest` is
      # only a convenience alias and is never a lock verification target.
      - name: Build and publish tools image
        id: tools_publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: docker/bard-tools.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve published digest
        env:
          BUILT_DIGEST: ${{ steps.tools_publish.outputs.digest }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in
            sha256:*) ;;
            *)
              echo "unresolved bard-tools digest: $BUILT_DIGEST" >&2
              exit 1
              ;;
          esac
          printf 'TOOLS_REF=ghcr.io/%s/bard-tools@%s\n' "$OWNER_LC" "$BUILT_DIGEST" >> "$GITHUB_ENV"
          printf 'TOOLS_DIGEST=%s\n' "$BUILT_DIGEST" >> "$GITHUB_ENV"
          printf 'TOOLS_TAG=%s-tools\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Measure published tools image
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          python3 scripts/measure_image_tools.py \
            --image-ref "$TOOLS_REF" \
            --out "$RUNNER_TEMP/bard-tools-tools.json"
      - name: Record published image summary
        run: |
          {
            echo "## bard-tools image"
            echo
            echo "- **image**: \`$TOOLS_REF\`"
            echo "- **tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open pin update PR
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_REF: ${{ env.TOOLS_REF }}
          TOOLS_DIGEST: ${{ env.TOOLS_DIGEST }}
          TOOLS_TAG: ${{ env.TOOLS_TAG }}
        run: |
          set -euo pipefail
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the
          # published source commit, so the PR stays mergeable when main moved
          # during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-tools-image-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          python3 scripts/update_tools_image_lock.py \
            --pin plugins/bard/skills/bard-render/tools-image.json \
            --image "ghcr.io/${OWNER_LC}/bard-tools" \
            --tag "$TOOLS_TAG" \
            --digest "$TOOLS_DIGEST" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/bard-tools-tools.json"
          if git diff --quiet -- plugins/bard/skills/bard-render/tools-image.json; then
            echo "Tools image pin is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bard/skills/bard-render/tools-image.json
          git commit -m "Update bard-tools image pin"
          git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the bard-tools image pin." \
            "" \
            "image: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update bard-tools image pin" \
            --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          # Pull_request workflows on the bot pin branch queue as
          # approval-gated action_required runs (first-time-contributor
          # gate). They appear asynchronously after the PR opens, so poll
          # for and approve them — observed on #25: an immediate one-shot
          # list found none and the runs still sat awaiting approval. If
          # the API rejects the self-approval the dispatched runs below
          # still provide every required check.
          gated_seen=0
          empty_streak=0
          for _ in $(seq 1 10); do
            batch=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$branch" \
              --event pull_request --status action_required --json databaseId --jq '.[].databaseId')
            if [ -z "$batch" ]; then
              empty_streak=$((empty_streak + 1))
              if { [ "$gated_seen" -eq 0 ] && [ "$empty_streak" -ge 3 ]; } || \
                 { [ "$gated_seen" -eq 1 ] && [ "$empty_streak" -ge 2 ]; }; then
                break
              fi
              sleep 30
              continue
            fi
            empty_streak=0
            gated_seen=1
            for gated in $batch; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$gated/approve" || true
            done
            sleep 10
          done
          # Required checks come from dispatched runs on the branch:
          # ci.yml covers verify/plugin-load/independent-check and
          # workflow-lint.yml covers zizmor.
          started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run workflow-lint.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          failed=0
          for wf in ci.yml workflow-lint.yml; do
            run_id=""
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch "$branch" \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "$wf workflow_dispatch for $branch was not observed; the pin PR was left open" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "$wf run for $branch: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --interval 30 || true
            conclusion=$(gh run view --repo "$GITHUB_REPOSITORY" "$run_id" \
              --json conclusion --jq '.conclusion // "unknown"')
            echo "$wf conclusion for $branch: $conclusion"
            if [ "$conclusion" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "pin PR checks failed; the PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Enqueue the pin PR into the merge queue. gh pr merge --auto only
          # sets the auto-merge flag — on this repo it did not add the PR to
          # the queue (observed on #23) — so the GraphQL enqueuePullRequest
          # mutation is the explicit enqueue. It also requires every required
          # check green on the head sha, so it is retried while the approved
          # pull_request runs finish (about ten minutes max). If the queue
          # still rejects it, the PR is left open for manual merge.
          pr_id=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${pr_url##*/}" --jq '.node_id')
          enqueued=0
          for _ in $(seq 1 20); do
            if gh api graphql -f query="mutation { enqueuePullRequest(input: {pullRequestId: \"$pr_id\"}) { clientMutationId } }"; then
              enqueued=1
              break
            fi
            sleep 30
          done
          if [ "$enqueued" -eq 0 ]; then
            gh pr merge --repo "$GITHUB_REPOSITORY" --auto "$pr_url" || {
              echo "pin PR could not be enqueued; the PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::pin PR $pr_url could not be auto-merged; merge it via the merge queue"
            }
          fi
