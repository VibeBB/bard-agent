name: Publish bard images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-bard-images.yml"
      - "scripts/measure_image_tools.py"
      - "scripts/update_tools_image_lock.py"
      - "!docker/README.md"
      # The lock file is written by this workflow itself; exclude it so a
      # merged lock PR does not trigger another publish.
      - "!plugins/bard/skills/bard-render/tools-image.json"

# Publishes are serialized: concurrent runs race on the `latest` alias and on
# the lock update branch, so a queued run must wait for the previous one.
concurrency:
  group: publish-bard-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # GHCR namespaces must be lowercase; repository_owner may contain capitals.
          printf 'OWNER_LC=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # The immutable `<sha>-tools` tag is what the lock records; `latest` is
      # only a convenience alias and is never a lock verification target.
      - name: Build and publish tools image
        id: tools_publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/bard-tools.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:${{ env.SOURCE_SHA }}-tools
            ghcr.io/${{ env.OWNER_LC }}/bard-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve published digest
        env:
          BUILT_DIGEST: ${{ steps.tools_publish.outputs.digest }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in
            sha256:*) ;;
            *)
              echo "unresolved bard-tools digest: $BUILT_DIGEST" >&2
              exit 1
              ;;
          esac
          printf 'TOOLS_REF=ghcr.io/%s/bard-tools@%s\n' "$OWNER_LC" "$BUILT_DIGEST" >> "$GITHUB_ENV"
          printf 'TOOLS_DIGEST=%s\n' "$BUILT_DIGEST" >> "$GITHUB_ENV"
          printf 'TOOLS_TAG=%s-tools\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Measure published tools image
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          python3 scripts/measure_image_tools.py \
            --image-ref "$TOOLS_REF" \
            --out "$RUNNER_TEMP/bard-tools-tools.json"
      # The render toolchain smoke mirrors the Dockerfile build-time check:
      # run the published image so a push that produced a broken artifact
      # fails here instead of surfacing at render time.
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          docker pull "$TOOLS_REF"
          docker run --rm "$TOOLS_REF" sh -c \
            "printf 'X:1\nT:smoke\nM:4/4\nL:1/8\nK:C\nC D E F |]\n' > /tmp/smoke.abc \
            && abcm2ps -g /tmp/smoke.abc -O /tmp/smoke.svg \
            && rsvg-convert /tmp/smoke001.svg -o /tmp/smoke.png \
            && test -s /tmp/smoke.png"
      - name: Record published image summary
        run: |
          {
            echo "## bard-tools image"
            echo
            echo "- **image**: \`$TOOLS_REF\`"
            echo "- **tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update image pin and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_REF: ${{ env.TOOLS_REF }}
          TOOLS_DIGEST: ${{ env.TOOLS_DIGEST }}
          TOOLS_TAG: ${{ env.TOOLS_TAG }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          dispatch_workflow() {
            # GITHUB_TOKEN-driven push/pull_request events never produce a real gate:
            # at most a stillborn pull_request run is recorded, so CI for the
            # pin branch and the checks after the merge is started explicitly.
            local workflow="$1" ref="$2" started run_id=""
            shift 2
            # Reset per-call so a previous dispatch's conclusion cannot leak
            # into the summary when this run is not observed.
            DISPATCH_RUN_URL=""
            DISPATCH_CONCLUSION=""
            started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            retry gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$ref" "$@"
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$ref" \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty' || true)
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "workflow_dispatch of $workflow for $ref was not observed" >&2
              return 1
            fi
            DISPATCH_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "$workflow run for $ref: ${DISPATCH_RUN_URL}"
            gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --interval 30 || true
            # An empty conclusion is a transient API failure, not a run
            # verdict: re-query until the API reports the conclusion.
            DISPATCH_CONCLUSION=""
            for _ in $(seq 1 6); do
              DISPATCH_CONCLUSION=$(retry gh run view --repo "$GITHUB_REPOSITORY" "$run_id" \
                --json conclusion --jq '.conclusion // empty' || true)
              [ -n "$DISPATCH_CONCLUSION" ] && break
              sleep 10
            done
            DISPATCH_CONCLUSION="${DISPATCH_CONCLUSION:-unknown}"
            echo "$workflow conclusion for $ref: ${DISPATCH_CONCLUSION}"
            [ "$DISPATCH_CONCLUSION" = "success" ]
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the
          # published source commit, so the PR stays mergeable when main moved
          # during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-tools-image-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          python3 scripts/update_tools_image_lock.py \
            --pin plugins/bard/skills/bard-render/tools-image.json \
            --image "ghcr.io/${OWNER_LC}/bard-tools" \
            --tag "$TOOLS_TAG" \
            --digest "$TOOLS_DIGEST" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/bard-tools-tools.json"
          # status --porcelain (not diff --quiet) also catches an untracked
          # pin file, matching the other agent publish workflows.
          if [ -z "$(git status --porcelain -- plugins/bard/skills/bard-render/tools-image.json)" ]; then
            echo "Tools image pin is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bard/skills/bard-render/tools-image.json
          git commit -m "Update bard-tools image pin"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the bard-tools image pin." \
            "" \
            "image: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review (observed: #25 and #31 stayed open).
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${workflow_run}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update bard-tools image pin" \
            --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          approve_gated_runs() {
            # Pull_request runs on the bot pin branch queue as
            # approval-gated action_required runs (first-time-contributor
            # gate); approve them up front — this job has actions: write.
            retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch==\"$branch\") | .id" \
              | while read -r run_id; do
                  retry gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" || true
                done
          }
          approve_gated_runs
          # Required checks come from dispatched runs on the branch:
          # ci.yml covers verify/plugin-load/independent-check and
          # workflow-lint.yml covers zizmor.
          failed=0
          for wf in ci.yml workflow-lint.yml; do
            if ! dispatch_workflow "$wf" "$branch"; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "pin PR checks failed; the PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Wait for every pull_request run on the pin branch to reach a
          # conclusion: they are the check suites the ruleset's required
          # checks read. A stillborn run never starts jobs; it sits in
          # startup until the branch-deleting merge kills it with a spurious
          # "workflow file issue" failure, so it is cancelled once nothing
          # else is pending. An approved-but-still-pending run keeps the
          # loop going instead.
          pr_checks_ok=false
          for _ in $(seq 1 36); do
            # Runs can surface gated later than the initial sweep, so keep
            # approving while waiting.
            approve_gated_runs
            pending=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == null)] | length' || echo 1)
            if [ "$pending" -eq 0 ]; then
              pr_checks_ok=true
              break
            fi
            sleep 10
          done
          if [ "$pr_checks_ok" != true ]; then
            for run_id in $(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == null) | .id' || true); do
              jobs=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" \
                --jq '.total_count // 0' || echo 0)
              if [ "$jobs" -eq 0 ]; then
                retry gh run cancel --repo "$GITHUB_REPOSITORY" "$run_id" || true
              fi
            done
            pending_after=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == null)] | length' || echo 1)
            [ "$pending_after" -eq 0 ] && pr_checks_ok=true
          fi
          # Only hard failures block: skipped/neutral/cancelled conclusions
          # are benign (a required check that ended cancelled still blocks
          # the merge call itself, so this stays fail-closed).
          bad=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .conclusion != "cancelled")] | length' || echo 1)
          if [ "$pr_checks_ok" != true ] || [ "$bad" -gt 0 ]; then
            echo "pin PR pull_request checks did not all pass (pending=${pr_checks_ok}, non-success=${bad}); the pin PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # --auto arms auto-merge so required checks that are still
          # registering do not fail the merge call; when every required
          # check is already green it merges at once.
          if ! retry gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch "$pr_url"; then
            echo "pin PR merge was blocked; the pin PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The merge may only be armed: wait for it to land before the
          # observational post-merge dispatches. A still-pending PR after the
          # wait merges on its own once checks pass, so that is not a failure.
          merged=false
          for _ in $(seq 1 36); do
            merged_at=$(retry gh api "repos/$GITHUB_REPOSITORY/pulls/${pr_url##*/}" --jq '.merged_at // empty' || true)
            [ -n "$merged_at" ] && { merged=true; break; }
            sleep 10
          done
          if [ "$merged" != true ]; then
            echo "auto-merge is armed on $pr_url but the merge did not land within the wait; post-merge checks skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The post-merge checks are observational: their conclusions (including
          # 'cancelled' when a newer main push supersedes them via concurrency
          # groups) are recorded in the step summary and never fail this run.
          dispatch_workflow ci.yml main || true
          main_conclusion="${DISPATCH_CONCLUSION:-not_observed}"
          main_run_url="${DISPATCH_RUN_URL:-no run observed}"
          echo "post-merge main CI: ${main_conclusion} ${main_run_url}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$main_conclusion" != "success" ]; then
            echo "::warning::post-merge main CI for ${pr_url} finished as ${main_conclusion}: ${main_run_url}"
          fi
          dispatch_workflow workflow-lint.yml main || true
          lint_conclusion="${DISPATCH_CONCLUSION:-not_observed}"
          lint_run_url="${DISPATCH_RUN_URL:-no run observed}"
          echo "post-merge workflow lint: ${lint_conclusion} ${lint_run_url}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lint_conclusion" != "success" ]; then
            echo "::warning::post-merge workflow lint for ${pr_url} finished as ${lint_conclusion}: ${lint_run_url}"
          fi
