name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit X.Y.Z override; leave empty to bump"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version files
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SET_VERSION="${SET_VERSION#v}"
          if [ -n "$SET_VERSION" ]; then
            VERSION=$(python3 scripts/bump_version.py --set "$SET_VERSION")
          else
            VERSION=$(python3 scripts/bump_version.py --bump "$BUMP")
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"; then
            echo "::error::tag v${VERSION} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bard/.plugin/plugin.json pyproject.toml \
            plugins/bard/skills/bard-render/SKILL.md \
            plugins/bard/skills/bard-songcraft/SKILL.md uv.lock
          git commit -m "リリース v${VERSION}: version を更新"
          git push origin HEAD:main
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: bump-version
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse
    with:
      ref: ${{ needs.bump-version.outputs.sha }}

  install-smoke:
    needs: bump-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.bump-version.outputs.sha }}
        run: >
          uv run --group sdk-check python scripts/smoke_install_plugin.py
          --repo uist1idrju3i/bard-agent --ref "$REF" --repo-path plugins/bard

  release:
    needs: [bump-version, verify, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      SHA: ${{ needs.bump-version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - name: Install ABC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends abcm2ps abcmidi ghostscript
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Render sample scores
        run: |
          for lang in en ja; do
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --proposal "tests/fixtures/valid_${lang}.json" \
              --out-dir "dist/samples/${lang}"
            abcm2ps "dist/samples/${lang}/song.abc" -O "dist/samples/${lang}/score.ps"
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=png16m -r150 \
              -sOutputFile="dist/samples/${lang}/score.png" "dist/samples/${lang}/score.ps"
          done
      - name: Build release zips
        run: |
          (cd plugins && zip -r "../dist/bard-plugin-v${VERSION}.zip" bard)
          zip -r "dist/bard-samples-v${VERSION}.zip" dist/samples
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}" --target "$SHA"
          --title "bard v${VERSION}" --generate-notes dist/*.zip
