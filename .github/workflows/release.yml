name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit X.Y.Z override; leave empty to bump"
        required: false
        type: string
      dry_run:
        description: "Rehearse the release: validate version arithmetic and run the downstream verify/install-smoke/build jobs against HEAD without committing, pushing, tagging, or releasing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    # Covers the slow path: direct-push rejection → bump PR + dispatched
    # checks + merge queue wait.
    timeout-minutes: 45
    permissions:
      actions: write # dispatches ci/workflow-lint and approves action_required runs on the bump branch
      contents: write # pushes the version-bump commit (or fallback PR branch)
      pull-requests: write # opens and auto-merges the fallback version-bump PR
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version files
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release_bump.sh

  verify:
    needs: bump-version
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse
    with:
      ref: ${{ needs.bump-version.outputs.sha }}

  install-smoke:
    needs: bump-version
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: install-smoke
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.bump-version.outputs.sha }}
        run: >
          uv run --group sdk-check python scripts/smoke_install_plugin.py
          --repo VibeBB/bard-agent --ref "$REF" --repo-path plugins/bard

  release:
    needs: [bump-version, verify, install-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the v<version> tag and GitHub release
      id-token: write # OIDC for release-asset provenance attestation
      attestations: write # stores the attestation
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      SHA: ${{ needs.bump-version.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: release
      - name: Sync dependencies
        run: uv sync --locked
      - name: Render sample scores
        run: |
          for lang in en ja; do
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --proposal "tests/fixtures/valid_${lang}.json" \
              --out-dir "dist/samples/${lang}"
            # No host ABC tools are installed: render_score_png.py falls back
            # to the pinned ghcr.io/bard-tools image, so the released samples
            # dog-food the image users' agents pull at render time.
            uv run python plugins/bard/skills/bard-render/scripts/render_score_png.py \
              --abc "dist/samples/${lang}/song.abc" --out-dir "dist/samples/${lang}" --json
          done
      - name: Build release zips
        run: |
          # Ship the project license and third-party notices inside the
          # plugin zip so the distributed artifact is self-contained.
          cp LICENSE THIRD_PARTY_NOTICES.md plugins/bard/
          (cd plugins && zip -r "../dist/bard-plugin-v${VERSION}.zip" bard)
          rm plugins/bard/LICENSE plugins/bard/THIRD_PARTY_NOTICES.md
          zip -r "dist/bard-samples-v${VERSION}.zip" dist/samples
      - name: Note dry-run release skip
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run: skipped creating release v${VERSION} at ${SHA}"
      - name: Create release and tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry gh release create "v${VERSION}" --target "$SHA" \
            --title "bard v${VERSION}" --generate-notes dist/*.zip
      - name: Attest release assets
        # The installed artifact (plugin zip) and samples get build-provenance
        # attestations so `gh attestation verify` covers what users install —
        # mirrors the image attestations in publish-bard-images.yml and lifts
        # the scorecard Signed-Releases signal off zero.
        if: ${{ !inputs.dry_run }}
        id: attest_assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Upload provenance bundle to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest_assets.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="dist/bard-v${VERSION}-provenance.intoto.jsonl"
          cp "$BUNDLE" "$bundle"
          gh release upload "v${VERSION}" "$bundle"
