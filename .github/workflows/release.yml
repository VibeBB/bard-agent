name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version consistency
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
          PLUGIN_VERSION=$(python3 -c \
            'import json; print(json.load(open("plugins/bard/.plugin/plugin.json"))["version"])')
          PYPROJECT_VERSION=$(python3 -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$VERSION" = "$PLUGIN_VERSION"
          test "$VERSION" = "$PYPROJECT_VERSION"
          # tag must not already exist
          ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: check-version
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse

  install-smoke:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.check-version.outputs.sha }}
        run: >
          uv run --group sdk-check python scripts/smoke_install_plugin.py
          --repo uist1idrju3i/bard-agent --ref "$REF" --repo-path plugins/bard

  release:
    needs: [verify, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.check-version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-version.outputs.sha }}
          persist-credentials: false
      - name: Install ABC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends abcm2ps abcmidi ghostscript
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Render sample scores
        run: |
          for lang in en ja; do
            uv run python plugins/bard/skills/bard-render/scripts/render_song.py \
              --proposal "tests/fixtures/valid_${lang}.json" \
              --out-dir "dist/samples/${lang}"
            abcm2ps "dist/samples/${lang}/song.abc" -O "dist/samples/${lang}/score.ps"
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=png16m -r150 \
              -sOutputFile="dist/samples/${lang}/score.png" "dist/samples/${lang}/score.ps"
          done
      - name: Build release zips
        run: |
          (cd plugins && zip -r "../dist/bard-plugin-v${VERSION}.zip" bard)
          zip -r "dist/bard-samples-v${VERSION}.zip" dist/samples
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}" --target "$SHA"
          --title "bard v${VERSION}" --generate-notes dist/*.zip
