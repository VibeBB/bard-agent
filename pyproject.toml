[project]
name = "bard-agent"
version = "1.1.0"
description = "A fantasy minstrel plugin for OpenHands that writes original songs about workspace work"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
]
sdk-check = ["openhands-sdk==1.52.0", "openhands-tools==1.52.0"]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.23"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["plugins/bard/skills/bard-render/scripts", "plugins/bard/scripts", "plugins/bard/hooks/scripts", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = ["scripts/structural_coverage.py", "tests/test_structural_coverage.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Canonical shared hooks are byte-identical across the VibeBB family; their
# line lengths follow wire's 100-char style, not bard's 88.
"plugins/bard/hooks/scripts/_records.py" = ["E501"]
"plugins/bard/hooks/scripts/require_records.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["plugins/bard/skills/bard-render/scripts", "plugins/bard/hooks/scripts", "plugins/bard/scripts", "scripts", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
# The proposal JSON boundary is intentionally untyped; strict Unknown-reporting
# would only repeat what the validator already checks at runtime.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs -n auto --dist loadgroup"

[tool.coverage.run]
source = ["plugins/bard"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
c0 = 80
c1 = 69
decision = 52
c2 = 48
mcdc = 26
boundary = 24

[tool.coverage.report]
fail_under = 77
